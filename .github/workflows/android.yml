name: Android CI and optional prerelease

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a prerelease after all checks succeed'
        type: boolean
        default: false
      tag:
        description: 'New release tag, for example v0.1.0-alpha.1'
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: false
      - name: Test bootstrap safety
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate the Android scaffold
        run: python3 scripts/bootstrap.py
      - name: Audit Android scaffold
        run: python3 scripts/audit_scaffold.py
      - name: Resolve dependencies
        run: scripts/ci.sh flutter pub get
      - name: Record resolved lockfile for audit
        run: |
          python3 -c 'import base64,pathlib,zlib; data=pathlib.Path("pubspec.lock").read_bytes(); print("::notice title=Resolved pubspec lock::"+base64.b64encode(zlib.compress(data)).decode())'
      - name: Static analysis
        run: scripts/ci.sh flutter analyze --no-pub
      - name: Unit and widget tests
        run: scripts/ci.sh flutter test --no-pub
      - name: Build release-mode APK with a debug signing key
        run: scripts/ci.sh flutter build apk --release --no-pub
      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/personal-agent-android.apk
          cd release
          sha256sum personal-agent-android.apk > SHA256SUMS.txt
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APK_SIGNER" verify --verbose --print-certs personal-agent-android.apk > signature.txt
          cat SHA256SUMS.txt signature.txt
          echo "::notice title=APK checksum::$(cat SHA256SUMS.txt)"
          echo "::notice title=APK signature::$(grep 'Signer #1 certificate SHA-256 digest:' signature.txt)"
      - name: Upload verified build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-agent-android
          path: |
            release/personal-agent-android.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: personal-agent-android
          path: release
      - name: Verify checksum and publish a new prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Invalid release tag' >&2; exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to reuse an existing tag' >&2; exit 1
          fi
          (cd release && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" \
            release/personal-agent-android.apk release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease --title "$RELEASE_TAG" \
            --notes-file docs/RELEASE_NOTES_AR.md

name: personal_agent
description: A supervised, Android-first personal coding assistant.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: 8.1.7
  http: 1.3.0
  path: 1.9.0
  path_provider: 2.1.5
  share_plus: 10.1.4
  webview_flutter: 4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
